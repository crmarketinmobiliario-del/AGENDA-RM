<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090705"><title>Agenda Ejecutiva de Lujo</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="style.css"></head>
<body>
<main id="stage">
  <img id="background" src="fondo-original.jpg" alt="">
  <div id="dial" aria-label="Reloj analógico en hora real"><div class="watch-brand">ROLEX</div><div id="marks"></div><div class="hand hour" id="hour"></div><div class="hand minute" id="minute"></div><div class="hand second" id="second"></div><div class="pivot"></div><div id="watch-date"></div></div>
  <div id="paper">
    <div class="paper-heading" id="paper-title">Mis Pendientes de Hoy</div>
    <div id="page-content"></div>
    <div id="page-counter"></div>
  </div>
  <button id="pen" aria-label="Tocar la pluma completa para escribir o guardar"><img src="pluma-ejecutiva.svg" alt="Pluma negra de vestir con detalles dorados"></button>
  <div id="toast" role="status"></div>
  <section id="editor" hidden><div class="editor-sheet"><h2>Hoja de notas</h2><p>Escribe aquí. Toca la pluma otra vez para guardar.</p><textarea id="note-text" placeholder="Nombre, teléfono, domicilio, pendiente..."></textarea><label>Recordarme (opcional)<input type="datetime-local" id="note-date"></label><button id="cancel-note">Cancelar</button></div></section>
  <div id="toolbar"><button id="add-task">+ Pendiente</button><button id="notes">Notas rápidas</button><button id="notify">Activar avisos</button><button id="export">Respaldar</button></div>
</main>
<input type="file" id="restore-file" accept="application/json" hidden>
<script src="app.js"></script></body></html>
